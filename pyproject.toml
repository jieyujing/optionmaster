[project]
name = "vnpy_optionmaster"
dynamic = ["version"]
description = "Option pricing and trading application for VeighNa quant trading framework."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Xiaoyou Chen", email = "xiaoyou.chen@mail.vnpy.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: Chinese (Simplified)",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.0.0",
    "scipy>=1.15.2",
    "matplotlib>=3.10.1",
    "exchange_calendars>=4.10"
]
keywords = ["quant", "quantitative", "investment", "trading", "algotrading", "options"]

[project.optional-dependencies]
research-web = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]
research-web-test = ["httpx>=0.28,<1"]

[project.urls]
"Homepage" = "https://www.vnpy.com"
"Documentation" = "https://www.vnpy.com/docs"
"Changes" = "https://github.com/vnpy/vnpy_optionmaster/blob/master/CHANGELOG.md"
"Source" = "https://github.com/vnpy/vnpy_optionmaster/"
"Forum" = "https://www.vnpy.com/forum"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vnpy_optionmaster/__init__.py"
pattern = "__version__ = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["vnpy_optionmaster"]
include-package-data = true
# This is a universal wheel: never package stale Windows-only Cython binaries.
exclude = [
    "vnpy_optionmaster/pricing/cython_model",
    "vnpy_optionmaster/pricing/cython_model/**/*",
    "vnpy_optionmaster/pricing/*.pyd",
    "vnpy_optionmaster/pricing/*.so"
]

[tool.hatch.build]
packages = ["vnpy_optionmaster"]

[tool.hatch.build.targets.sdist]
include = ["vnpy_optionmaster*"]
exclude = [
    "vnpy_optionmaster/pricing/*.pyd",
    "vnpy_optionmaster/pricing/*.so"
]

[tool.ruff]
target-version = "py310"
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
